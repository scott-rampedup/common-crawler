<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password · Common Crawler</title>
  <link rel="icon" type="image/svg+xml" href="/ui/favicon.svg" />
  <link rel="stylesheet" href="/ui/styles.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <img class="auth-logo" src="/ui/logo.png" alt="Common Crawler" onerror="this.style.display='none'" />
    <h1>Forgot password</h1>
    <p class="auth-sub">Enter your account email and we'll send you a temporary password to sign in with.</p>
    <form id="forgotForm" class="auth-form" autocomplete="on">
      <label>Email
        <input id="email" type="email" autocomplete="email" required />
      </label>
      <p id="msg" class="auth-msg"></p>
      <button class="primary" type="submit">Send reset email</button>
    </form>
    <div class="auth-links"><a href="/login">Back to sign in</a></div>
  </div>
  <script src="/ui/forgot.js"></script>
</body>
</html>
