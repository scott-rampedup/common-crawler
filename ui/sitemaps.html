<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sitemap Library · Common Crawler</title>
  <link rel="icon" type="image/svg+xml" href="/ui/favicon.svg" />
  <link rel="apple-touch-icon" href="/ui/logo.png" />
  <link rel="stylesheet" href="/ui/styles.css" />
  <style>
    /* ---- Sitemap Library — reuses the shared crawler shell; these mirror company-crawler.html ---- */
    .cc-empty { color: #9ca3af; }
    .cc-count b { color: #111827; }

    /* faceted filter checklists (identical to Company Crawler) */
    .facet { display: flex; flex-direction: column; gap: 6px; }
    .facet > .facet-h { display: flex; align-items: baseline; justify-content: space-between; }
    .facet > .facet-h b { font-size: 0.9rem; color: #374151; font-weight: 700; }
    .facet-add { padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 0.88rem; font-family: inherit; }
    .facet-list { display: flex; flex-direction: column; gap: 2px; max-height: 240px; overflow-y: auto; padding-right: 2px; }
    .facet-list::-webkit-scrollbar { width: 8px; }
    .facet-list::-webkit-scrollbar-thumb { background: #dbe2ec; border-radius: 8px; }
    .facet-opt { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 8px; font-size: 0.86rem; color: #1f2937; cursor: pointer; flex-direction: row; }
    .facet-opt:hover { background: #f1f5f9; }
    .facet-opt input { width: 15px; height: 15px; flex: none; accent-color: #2563eb; margin: 0; }
    .facet-opt .lbl { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-transform: capitalize; }
    .facet-opt .cnt { font-variant-numeric: tabular-nums; color: #6b7280; font-size: 0.78rem; flex: none; }
    .facet-opt.on { background: #eef4ff; }
    .facet-opt.on .lbl { font-weight: 650; color: #1d4ed8; }
    .facet-empty { color: #9ca3af; font-size: 0.82rem; padding: 2px 6px; }

    /* active-filter chips above the results (identical to Company Crawler) */
    .cc-chips { display: flex; flex-wrap: wrap; gap: 7px; padding: 10px 18px; border-bottom: 1px solid #eef2f7; align-items: center; }
    .cc-chips[hidden] { display: none; }
    .cc-chip { display: inline-flex; align-items: center; gap: 7px; padding: 4px 6px 4px 11px; background: #eef2ff; color: #3730a3; border-radius: 999px; font-size: 0.82rem; font-weight: 600; white-space: nowrap; }
    .cc-chip .k { color: #6366f1; font-weight: 700; text-transform: uppercase; font-size: 0.66rem; letter-spacing: 0.04em; }
    .cc-chip button { border: none; background: rgba(99,102,241,.16); color: #3730a3; width: 17px; height: 17px; border-radius: 50%; cursor: pointer; font-size: 0.8rem; line-height: 1; padding: 0; }
    .cc-chip button:hover { background: rgba(99,102,241,.32); }
    .cc-chips .clear-all { border: none; background: none; color: #6b7280; font-weight: 600; font-size: 0.82rem; cursor: pointer; text-decoration: underline; }
    .cc-chips .clear-all:hover { color: #b91c1c; }

    thead th .arrow { color: #2563eb; font-size: 0.72rem; }

    /* Kind pill */
    .sl-pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 0.72rem; font-weight: 650; white-space: nowrap; }
    .sl-people { background: #dbeafe; color: #1d4ed8; }
    .sl-loc { background: #dcfce7; color: #15803d; }
    .sl-tag { display: inline-block; margin-left: 5px; padding: 0 6px; border-radius: 6px; background: #f3f4f6; color: #6b7280; font-size: 0.68rem; }

    /* Type pill (Parent / Child) */
    .sl-type { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 0.72rem; font-weight: 650; }
    .sl-parent { background: #fef3c7; color: #92400e; }
    .sl-child { background: #e0e7ff; color: #3730a3; }
    /* Sitemap URL link: keep long URLs tidy (full URL on hover) */
    a.sl-sm { display: inline-block; max-width: 440px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }
  </style>
</head>
<body class="search-page">
  <div class="search-shell">
    <header class="search-header">
      <div class="brand">
        <img class="app-logo" src="/ui/logo.png" alt="Common Crawler logo" onerror="this.onerror=null;this.src='/ui/favicon.svg';" />
        <h1>Common Crawler</h1>
      </div>
      <nav class="nav-actions"></nav>
    </header>

    <div class="search-layout">
      <!-- LEFT: filter rail -->
      <aside class="search-panel">
        <h2>Sitemap Library</h2>
        <div class="search-fields">
          <label>Search
            <input id="fq" type="search" placeholder="domain / sitemap name" />
          </label>
          <label>Kind
            <select id="fKind">
              <option value="">All (People + Location)</option>
              <option value="People">People</option>
              <option value="Location">Location</option>
            </select>
          </label>
          <label>Type
            <select id="fType">
              <option value="">All (Parent + Child)</option>
              <option value="Parent">Parent (top-level)</option>
              <option value="Child">Child (under an index)</option>
            </select>
          </label>
          <label>Domain
            <input id="fDomain" type="search" placeholder="e.g. usbank.com" />
          </label>
          <label>Keyword
            <input id="fKeyword" type="search" placeholder="e.g. agents, locations, team" />
          </label>

          <div class="facet" data-field="industry">
            <div class="facet-h"><b>Industry</b></div>
            <input class="facet-add" id="addIndustry" list="industries" placeholder="Type an industry, press Enter…" />
            <div class="facet-list" id="facetIndustry"><span class="facet-empty">Search to see counts</span></div>
          </div>

          <label>Min pages
            <input id="fMinCount" type="number" min="0" placeholder="e.g. 50" />
          </label>
          <label>Match
            <select id="fByName">
              <option value="">Name + ratio</option>
              <option value="yes">Name-matched</option>
              <option value="no">Ratio-only</option>
            </select>
          </label>
        </div>

        <div class="search-actions">
          <button id="slSearch" class="primary" type="button">Search</button>
          <button id="slReset" class="ghost" type="button">Clear</button>
        </div>
        <p class="search-hint">Searching <b id="slTotalIdx">…</b> sitemaps.</p>
      </aside>

      <!-- RIGHT: results -->
      <main class="results-panel">
        <div class="results-toolbar">
          <p id="resultsSummary">Loading…</p>
          <div class="toolbar-actions">
            <span id="slSelInfo" class="selected-info"></span>
            <button id="slCrawl" class="primary" type="button" style="display:none">🕷 Crawl selected (<span id="slSelCount">0</span>)</button>
          </div>
        </div>

        <div id="slChips" class="cc-chips" hidden></div>

        <div class="results-scroll" id="slScroll">
          <table id="slTable">
            <thead><tr id="slHead"></tr></thead>
            <tbody id="slBody"></tbody>
          </table>
        </div>

        <div class="pagination" id="slPager" style="display:none">
          <button id="slFirst" type="button" title="First page">«</button>
          <button id="slPrev" type="button" title="Previous page">‹ Prev</button>
          <span id="slPageInfo" class="page-info">Page 1 of 1</span>
          <button id="slNext" type="button" title="Next page">Next ›</button>
          <button id="slLast" type="button" title="Last page">»</button>
        </div>
      </main>
    </div>
  </div>

  <datalist id="industries">
    <option>real estate</option><option>insurance</option><option>financial services</option><option>investment banking</option>
    <option>investment management</option><option>banking</option><option>capital markets</option><option>legal services</option>
    <option>law practice</option><option>hospital &amp; health care</option><option>medical practice</option>
    <option>health, wellness and fitness</option><option>retail</option><option>restaurants</option><option>automotive</option>
  </datalist>

  <script src="/ui/nav.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const abs = (u) => /^https?:/i.test(u) ? u : ('https://' + u);
    const TC_UP = new Set(['llc', 'inc', 'usa', 'us', 'uk']);
    const tc = (s) => String(s == null ? '' : s).toLowerCase().split(/(\s+|-|\/|,)/).map((w) => (/^(\s+|-|\/|,)$/.test(w) || !w) ? w : (TC_UP.has(w) ? w.toUpperCase() : w.charAt(0).toUpperCase() + w.slice(1))).join('');

    const PAGE = 50;
    let from = 0, total = 0, hasSearched = false;
    const sortState = { col: 'item_count', dir: 'desc' };
    const selected = new Map();      // sitemap_url -> row (cross-page)
    let rowsById = {};
    const sel = { industry: new Set() };

    // Columns (after the checkbox col). sort = server sort key; num = right-ish numeric cell.
    const COLS = [
      { key: 'domain',     label: 'Domain' },
      { key: 'kind',       label: 'Kind' },
      { key: 'type',       label: 'Type' },
      { key: 'sitemap',    label: 'Sitemap' },
      { key: 'item_count', label: 'Pages',        sort: 'item_count' },
      { key: 'ratio',      label: 'Ratio',        sort: 'ratio' },
      { key: 'industry',   label: 'Industry' },
      { key: 'lastmod',    label: 'Last modified' },
    ];

    function filters() {
      return {
        q: $('fq').value.trim(), kind: $('fKind').value, type: $('fType').value,
        domain: $('fDomain').value.trim(), keyword: $('fKeyword').value.trim(),
        industry: [...sel.industry].join(','),
        minCount: $('fMinCount').value.trim(), byName: $('fByName').value,
      };
    }
    function qs(extra) {
      const f = filters(), p = new URLSearchParams();
      for (const k in f) if (f[k]) p.set(k, f[k]);
      if (sortState.col) { p.set('sort', sortState.col); p.set('dir', sortState.dir); }
      for (const k in (extra || {})) p.set(k, extra[k]);
      return p.toString();
    }

    function renderHead() {
      $('slHead').innerHTML =
        '<th class="check-col"><input type="checkbox" id="slAll" class="all-check" title="Select all on this page" /></th>' +
        COLS.map((c) => {
          if (!c.sort) return '<th>' + esc(c.label) + '</th>';
          const active = sortState.col === c.sort;
          const arrow = active ? ' <span class="arrow">' + (sortState.dir === 'asc' ? '▲' : '▼') + '</span>' : '';
          return '<th class="sortable' + (active ? ' sorted' : '') + '" data-sort="' + c.sort + '">' + esc(c.label) + arrow + '</th>';
        }).join('');
      $('slAll').addEventListener('change', (e) => togglePage(e.target.checked));
      document.querySelectorAll('#slHead th.sortable').forEach((th) => th.addEventListener('click', () => {
        const s = th.getAttribute('data-sort');
        if (sortState.col === s) sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
        else { sortState.col = s; sortState.dir = 'desc'; }
        search(0);
      }));
    }

    async function search(newFrom) {
      hasSearched = true; from = newFrom || 0;
      $('resultsSummary').textContent = 'Searching…'; $('slSearch').disabled = true;
      try {
        const r = await fetch('/api/sitemaps/search?' + qs({ from, size_n: PAGE }));
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
        total = d.total || 0; renderHead(); render(d.rows || []);
        loadFacets(); renderChips();
      } catch (e) { $('resultsSummary').textContent = 'Search failed: ' + e.message; }
      $('slSearch').disabled = false;
    }

    function kindPill(k, byName) {
      const cls = k === 'People' ? 'sl-people' : (k === 'Location' ? 'sl-loc' : '');
      return '<span class="sl-pill ' + cls + '">' + esc(k || '?') + '</span>' + (byName ? '<span class="sl-tag">name</span>' : '');
    }

    function render(rows) {
      const dash = '<span class="cc-empty">—</span>';
      $('slPager').style.display = total > PAGE ? 'flex' : 'none';
      if (!rows.length) {
        $('slBody').innerHTML = '<tr><td colspan="9" style="padding:34px 16px;text-align:center;color:#9ca3af">' +
          (hasSearched ? 'No sitemaps match these filters. Try removing a filter.' : 'Loading…') + '</td></tr>';
        rowsById = {}; updateSel(); return;
      }
      const byId = {};
      $('slBody').innerHTML = rows.map((d) => {
        const id = d.sitemap_url; byId[id] = d;
        const checked = selected.has(id) ? ' checked' : '';
        const pages = '<b>' + Number(d.item_count || 0).toLocaleString() + '</b> <span class="cc-empty">/ ' + Number(d.url_count || 0).toLocaleString() + '</span>';
        const ratio = (d.ratio != null && d.ratio !== '') ? Math.round(d.ratio * 100) + '%' : dash;
        const type = d.parent_url ? 'Child' : 'Parent';
        const smText = String(id).replace(/^https?:\/\//i, '');
        return '<tr' + (selected.has(id) ? ' class="selected"' : '') + '>' +
          '<td class="check-col"><input type="checkbox" class="row-check slRow" data-id="' + esc(id) + '"' + checked + ' /></td>' +
          '<td>' + (d.domain ? esc(d.domain) : dash) + '</td>' +
          '<td>' + kindPill(d.kind, d.by_name) + '</td>' +
          '<td><span class="sl-type sl-' + type.toLowerCase() + '">' + type + '</span></td>' +
          '<td><a class="domain-link sl-sm" href="' + esc(abs(id)) + '" target="_blank" rel="noopener" title="' + esc(id) + '">' + esc(smText) + '</a></td>' +
          '<td class="cc-count">' + pages + '</td>' +
          '<td>' + ratio + '</td>' +
          '<td>' + (d.industry ? esc(tc(d.industry)) : dash) + '</td>' +
          '<td>' + (d.lastmod ? esc(String(d.lastmod).slice(0, 10)) : dash) + '</td>' +
        '</tr>';
      }).join('');
      document.querySelectorAll('.slRow').forEach((cb) => cb.addEventListener('change', () => {
        const id = cb.getAttribute('data-id');
        if (cb.checked) selected.set(id, byId[id]); else selected.delete(id);
        cb.closest('tr').classList.toggle('selected', cb.checked);
        updateSel();
      }));
      rowsById = byId;
      const shownTo = Math.min(from + PAGE, total);
      const pages = Math.max(1, Math.ceil(total / PAGE)), cur = Math.floor(from / PAGE) + 1;
      $('slPageInfo').textContent = 'Page ' + cur + ' of ' + pages.toLocaleString() + ' · ' + (from + 1).toLocaleString() + '–' + shownTo.toLocaleString() + ' of ' + total.toLocaleString();
      $('slFirst').disabled = from <= 0; $('slPrev').disabled = from <= 0;
      $('slNext').disabled = shownTo >= total; $('slLast').disabled = shownTo >= total;
      updateSel();
    }

    // ---- facets + summary ----
    async function loadFacets() {
      try {
        const r = await fetch('/api/sitemaps/facets?' + qs());
        const d = await r.json(); if (!r.ok) return;
        renderFacet('industry', $('facetIndustry'), d.industry || []);
        const kc = Object.fromEntries((d.kind || []).map((x) => [x.key, x.count]));
        $('resultsSummary').textContent = (d.total || 0).toLocaleString() + ' sitemap(s) · ' +
          (d.harvestable || 0).toLocaleString() + ' harvestable pages · ' +
          (kc.People || 0).toLocaleString() + ' People / ' + (kc.Location || 0).toLocaleString() + ' Location';
      } catch (e) { /* leave prior facet/summary state */ }
    }
    function renderFacet(field, host, buckets) {
      const counts = new Map(buckets.map((b) => [b.key, b.count]));
      let keys = buckets.map((b) => b.key);
      for (const k of sel[field]) if (!keys.includes(k)) keys.unshift(k);   // always show selected
      if (!keys.length) { host.innerHTML = '<span class="facet-empty">No values</span>'; return; }
      host.innerHTML = keys.map((k) => {
        const on = sel[field].has(k), c = counts.get(k);
        return '<label class="facet-opt' + (on ? ' on' : '') + '">' +
          '<input type="checkbox" data-field="' + field + '" value="' + esc(k) + '"' + (on ? ' checked' : '') + ' />' +
          '<span class="lbl" title="' + esc(k || '(none)') + '">' + esc(k || '(none)') + '</span>' +
          '<span class="cnt">' + (c != null ? c.toLocaleString() : (on ? '·' : '0')) + '</span></label>';
      }).join('');
      host.querySelectorAll('input[type=checkbox]').forEach((cb) => cb.addEventListener('change', () => {
        const v = cb.value; if (cb.checked) sel[field].add(v); else sel[field].delete(v); search(0);
      }));
    }

    // ---- active-filter chips ----
    function renderChips() {
      const chips = [];
      const add = (k, label, clear) => chips.push({ k, label, clear });
      if (filters().q) add('search', filters().q, () => { $('fq').value = ''; });
      if ($('fKind').value) add('kind', $('fKind').value, () => { $('fKind').value = ''; });
      if ($('fType').value) add('type', $('fType').value, () => { $('fType').value = ''; });
      if ($('fDomain').value.trim()) add('domain', $('fDomain').value.trim(), () => { $('fDomain').value = ''; });
      if ($('fKeyword').value.trim()) add('name', $('fKeyword').value.trim(), () => { $('fKeyword').value = ''; });
      if ($('fMinCount').value.trim()) add('min pages', $('fMinCount').value.trim(), () => { $('fMinCount').value = ''; });
      if ($('fByName').value) add('match', $('fByName').value === 'yes' ? 'name-matched' : 'ratio-only', () => { $('fByName').value = ''; });
      for (const ind of sel.industry) add('industry', ind, () => sel.industry.delete(ind));
      const host = $('slChips');
      if (!chips.length) { host.hidden = true; host.innerHTML = ''; return; }
      host.hidden = false;
      host.innerHTML = chips.map((c, i) =>
        '<span class="cc-chip" data-i="' + i + '"><span class="k">' + esc(c.k) + '</span>' + esc(c.label) + ' <button type="button" aria-label="remove">×</button></span>'
      ).join('') + '<button type="button" class="clear-all" id="slClearAll">Clear all</button>';
      chips.forEach((c, i) => host.querySelector('.cc-chip[data-i="' + i + '"] button').addEventListener('click', () => { c.clear(); search(0); }));
      $('slClearAll').addEventListener('click', clearAll);
    }

    // ---- selection ----
    function updateSel() {
      const n = selected.size;
      $('slSelInfo').textContent = n ? n.toLocaleString() + ' selected' : '';
      $('slSelCount').textContent = n;
      $('slCrawl').style.display = n ? 'inline-flex' : 'none';
    }
    function togglePage(on) {
      document.querySelectorAll('.slRow').forEach((cb) => {
        cb.checked = on; const id = cb.getAttribute('data-id');
        const tr = cb.closest('tr'); if (tr) tr.classList.toggle('selected', on);
        if (on) selected.set(id, rowsById[id]); else selected.delete(id);
      });
      updateSel();
    }

    function clearAll() {
      ['fq', 'fDomain', 'fKeyword', 'fMinCount'].forEach((i) => { $(i).value = ''; });
      $('fKind').value = ''; $('fType').value = ''; $('fByName').value = ''; sel.industry.clear();
      search(0);
    }

    // ---- wiring ----
    $('slSearch').addEventListener('click', () => search(0));
    $('slReset').addEventListener('click', clearAll);
    ['fq', 'fDomain', 'fKeyword', 'fMinCount'].forEach((i) => $(i).addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); search(0); } }));
    $('fKind').addEventListener('change', () => search(0));
    $('fType').addEventListener('change', () => search(0));
    $('fByName').addEventListener('change', () => search(0));
    $('addIndustry').addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return; e.preventDefault();
      const v = e.target.value.trim().toLowerCase(); if (v) { sel.industry.add(v); e.target.value = ''; search(0); }
    });
    $('slFirst').addEventListener('click', () => search(0));
    $('slPrev').addEventListener('click', () => search(Math.max(0, from - PAGE)));
    $('slNext').addEventListener('click', () => search(from + PAGE));
    $('slLast').addEventListener('click', () => search((Math.ceil(total / PAGE) - 1) * PAGE));
    $('slCrawl').addEventListener('click', () => {
      const n = selected.size, pages = [...selected.values()].reduce((a, d) => a + (Number(d.item_count) || 0), 0);
      alert('Crawling from the Library is the next phase.\n\nThis will enqueue the ' + n.toLocaleString() + ' selected sitemap(s) (~' + pages.toLocaleString() + ' pages) into extraction:\n  • People → contacts\n  • Location → companies');
    });

    // ---- initial load: index-wide total for the hint, then show everything (pages desc) ----
    (async function init() {
      try { const r = await fetch('/api/sitemaps/facets'); if (r.ok) { const d = await r.json(); $('slTotalIdx').textContent = (d.total || 0).toLocaleString(); } }
      catch (e) { $('slTotalIdx').textContent = '—'; }
      search(0);
    })();
  </script>
</body>
</html>
