# Fly.io config for common-crawler.
app = 'common-crawler'
primary_region = 'ewr'   # must match the existing 'data' volume's region

[build]

[env]
  DATA_DIR = '/data'
  DEMO_MODE = 'false'
  SEARCH_BACKEND = 'opensearch'   # serve the Master DB read path from the OpenSearch production store (needs OPENSEARCH_ENDPOINT secret)
  NODE_OPTIONS = '--max-old-space-size=6144'   # let V8 use the 8GB box (default ~2GB caused SIGABRT)
  LIVE_MAX_PAGES = '300'        # max pages the live crawler fetches per domain (sitemap-driven)
  DOMAIN_CONCURRENCY = '48'     # total domains/URLs in flight (safe now: rotating proxy IPs)
  IN_SITE_CONCURRENCY = '4'     # how many pages from one site to fetch at once
  HOST_CONCURRENCY = '3'        # max simultaneous requests to any single host (stays polite per site)
  CC_CONCURRENCY = '1'          # global Common Crawl request limit (keep low: shared service)
  HTML_MAX_KB = '1024'          # cap HTML page size we download/parse (KB)
  FIX_REMAX_LOC = '3'           # one-off (re-run, positional parser): fix remaining remax 'Denver, CO' locations from the slug. REMOVE after it runs.

# Two process groups: the existing web app (KEEP the name 'app' so its machine + 'data' volume are
# untouched) and the extraction worker fleet (worker.js, pulls from the Postgres crawl_queue).
[processes]
  app = 'node ui-server.js'
  # worker = 'node worker.js'   # FLEET RETIRED 2026-07-10: extraction moved to the Lambda pipeline
  #   (cc-athena-miner -> lambda-drive -> cc-extract -> S3 -> load-extracted -> OpenSearch). Left commented
  #   so `flyctl deploy` stops resurrecting workers. To bring the fleet back: uncomment this + the worker
  #   [[vm]] block below, then `flyctl scale count worker=N`.

# Only the web group mounts the SQLite volume; workers are stateless (they use Postgres).
[[mounts]]
  source = 'data'
  destination = '/data'
  processes = ['app']

# HTTP traffic only goes to the web group; workers serve nothing.
[http_service]
  internal_port = 3000          # our Node server listens on 3000 (NOT Fly's default 8080)
  force_https = true
  auto_stop_machines = 'off'    # keep the machine on so background jobs keep running
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # Auto-restart the machine if the HTTP server hangs (event-loop block): a healthy app returns 200 on
  # the public /login page in well under the timeout; a hung one fails the check and Fly recycles it.
  [[http_service.checks]]
    interval = "30s"
    timeout = "8s"
    grace_period = "90s"
    method = "get"
    path = "/login"

# web: dedicated 4-vCPU / 8GB for sustained crawl + the wireless-block table.
[[vm]]
  processes = ['app']
  memory = '8gb'
  cpu_kind = 'performance'
  cpus = 4

# worker VM (retired 2026-07-10 with the worker process above — uncomment both to restore the fleet):
